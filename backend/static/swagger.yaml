openapi: 3.1.0
info:
  title: SuggestIT backend
  version: 2.0.0
  description: |
    Backend of [SuggestIT](https://suggestit.chalmers.it), the suggestion box
    for the committee P.R.I.T.

    Anyone can post a suggestion. Reading and deleting suggestions requires a
    login through Gamma (OpenID Connect). The session is an encrypted,
    HttpOnly cookie (`__Host-suggestit_session`, or `suggestit_session` when
    `COOKIE_DOMAIN` is set or in http-only local development).

    The API is served same-origin with the frontend (no CORS). Unsafe methods
    (POST, DELETE) from cross-origin browser contexts are rejected with 403;
    the origin of `CALLBACK_URL` is always trusted. Request bodies are JSON
    (`Content-Type: application/json`), at most 64 KiB. Unknown `/api/` paths
    return a JSON 404, and known paths called with the wrong method a JSON 405
    with an `Allow` header.
  contact:
    email: digit@chalmers.it

servers:
  - url: https://suggestit.chalmers.it
  - url: http://localhost:3000
    description: Local development (Vite dev server proxying /api)

tags:
  - name: Authentication
  - name: Suggestions
  - name: Operations

paths:
  /api/auth/login:
    get:
      tags: [Authentication]
      summary: Start a Gamma login
      description: >-
        Sets short-lived state and PKCE cookies, plus a `__Host-suggestit_login`
        cookie binding the state to this browser, and redirects to Gamma.
      responses:
        "302":
          description: Redirect to Gamma's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }

  /api/auth/callback:
    get:
      tags: [Authentication]
      summary: Gamma redirect target
      description: |
        Exchanges the authorization code, fetches userinfo and starts a session.
        In production Gamma redirects to the frontend route `/callback`, which
        forwards the browser (with its query string) here.
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
      responses:
        "302":
          description: |
            `Location: /` with a `Set-Cookie` session cookie on success,
            `Location: /?login=failed` on any failure.
          headers:
            Location:
              schema: { type: string, enum: ["/", "/?login=failed"] }

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      responses:
        "204":
          description: Session cookie cleared.
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/me:
    get:
      tags: [Authentication]
      summary: The logged-in user
      security: [{ session: [] }]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/suggestions:
    get:
      tags: [Suggestions]
      summary: List all suggestions, newest first
      security: [{ session: [] }]
      responses:
        "200":
          description: All suggestions (an empty array when there are none).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Suggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Suggestions]
      summary: Post a suggestion (no login required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSuggestion" }
      responses:
        "201":
          description: The created suggestion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/suggestions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Suggestions]
      summary: Get one suggestion
      security: [{ session: [] }]
      responses:
        "200":
          description: The suggestion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Suggestions]
      summary: Delete one suggestion
      security: [{ session: [] }]
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/suggestions/delete:
    post:
      tags: [Suggestions]
      summary: Delete several suggestions
      description: Deletes the given suggestions in one statement. Unknown ids are ignored.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CrossOrigin" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /healthz:
    get:
      tags: [Operations]
      summary: Health check (pings the database)
      responses:
        "200":
          description: Healthy.
          content:
            text/plain:
              schema: { type: string, const: "ok" }
        "503":
          description: The database is unreachable.

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-suggestit_session

  schemas:
    Suggestion:
      type: object
      required: [id, timestamp, title, text, author]
      properties:
        id: { type: string, format: uuid }
        timestamp:
          type: string
          format: date-time
          description: Creation time, RFC 3339 in UTC.
          examples: ["2026-11-06T12:34:56.789012Z"]
        title: { type: string }
        text: { type: string }
        author:
          type: string
          description: '"Anonymous" when no author was given.'

    NewSuggestion:
      type: object
      required: [title, text]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; required.
        text:
          type: string
          minLength: 1
          maxLength: 10000
          description: Trimmed; required.
        author:
          type: string
          maxLength: 100
          description: Trimmed. Empty or "anonymous" (any case) is stored as "Anonymous".

    User:
      type: object
      required: [cid, nickname, name, picture]
      properties:
        cid: { type: string }
        nickname: { type: string }
        name: { type: string }
        picture: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

  responses:
    BadRequest:
      description: Invalid body or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not logged in (an invalid session cookie is also cleared).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such suggestion (also for ids that are not UUIDs).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CrossOrigin:
      description: Cross-origin browser request rejected (CSRF protection).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Request body larger than 64 KiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
