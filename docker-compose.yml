services:
  db:
    image: postgres:11
    environment:
      POSTGRES_USER: suggestit
      POSTGRES_DB: suggestit
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432

  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - 8080:8080

  backend:
    build:
      context: ./backend/
      dockerfile: dev.Dockerfile
    environment:
      SUGGESTIT_POSTGRES_USER: suggestit
      SUGGESTIT_POSTGRES_PASSWORD: password
      SUGGESTIT_POSTGRES_HOST: db
      SUGGESTIT_POSTGRES_PORT: 5432
      SUGGESTIT_POSTGRES_DB: suggestit

      OAUTH_CLIENT_SECRET:
      OAUTH_CLIENT_ID:
      OAUTH_URL:
      CALLBACK_URL: http://localhost:3001/callback
      COOKIE_DOMAIN: localhost
    volumes:
      - ./backend/:/go/src/app

    depends_on:
      - db

    ports:
      - 5000:3000

  frontend:
    build:
      context: ./frontend/
      dockerfile: dev.Dockerfile
    ports:
      - 3001:3000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/usr/src

  redis:
    image: redis:5.0
